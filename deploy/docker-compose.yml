# Lamio sur le VPS, à côté de Cairn et Metricove.
#
# Le Caddy déjà en place (celui de Metricove) occupe les ports 80 et 443 : Lamio passe par lui
# (voir docs/DEPLOIEMENT.md, étape 3).
#
#   cd deploy && docker compose up -d --build

services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_DIR: /data
      TZ: Europe/Zurich
    volumes:
      - app-data:/data
    ports:
      - "${APP_BIND:-172.17.0.1}:${APP_PORT:-3030}:3000"

volumes:
  app-data:
